---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: "gateway-route"
spec:
  parentRefs:
    - name: "gateway"
  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/api"
      filters:
        - type: "URLRewrite"
          urlRewrite:
            path:
              type: "ReplacePrefixMatch"
              replacePrefixMatch: "/"
      backendRefs:
        - name: "api-service"
          port: 9002
